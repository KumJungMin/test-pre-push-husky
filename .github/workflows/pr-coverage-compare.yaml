name: PR Coverage Compare

on:
  pull_request:
    branches:
      - develop  # base가 develop인 PR에 대해 실행

permissions:
  contents: read
  issues: write
  pull-requests: write
  
jobs:
  test-and-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # 전체 히스토리 가져오기

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      # 1. `develop` 브랜치의 커버리지 생성
      - name: Checkout develop branch
        run: |
          git fetch origin develop
          git checkout origin/develop -b develop

      - name: Run tests on develop
        run: npx vitest --coverage

      - name: Save develop coverage
        run: |
          mkdir -p coverage-develop
          cp coverage/coverage-summary.json coverage-develop/coverage-summary.json

      # 2. 다시 `current` 브랜치로 돌아와 테스트 실행
      - name: Checkout current branch again
        run: git checkout ${{ github.head_ref }}

      - name: Run tests on current
        run: npx vitest --coverage

      - name: Save current coverage
        run: |
          mkdir -p coverage-current
          cp coverage/coverage-summary.json coverage-current/coverage-summary.json

      # 3. Compare coverage
      - name: Install ts-node and TypeScript
        run: npm install -D ts-node typescript

      - name: Compare coverage
        run: npx ts-node scripts/compare-change-file-coverage.ts
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_EVENT_AFTER: ${{ github.event.after }}
          GITHUB_SHA: ${{ github.sha }}
        
      # 4. Comment coverage result to PR
      - name: Comment coverage result to PR
        if: always()  
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const result = fs.readFileSync('coverage-diff-result.txt', 'utf-8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: result,
            });
