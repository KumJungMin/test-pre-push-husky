name: Develop Coverage

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  issues: write
  pull-requests: write
  
jobs:
  test-and-compare:
    if: github.base_ref == 'develop' && github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Checkout develop branch
        run: |
          git fetch origin develop
          git checkout origin/develop

      - name: Run tests on develop
        run: npx vitest --coverage

      - name: Save develop coverage
        run: |
          mkdir -p coverage-develop
          cp coverage/coverage-summary.json coverage-develop/coverage-summary.json

      - name: Checkout current branch again and run tests
        run: |
          git checkout ${{ github.head_ref }}
          npx vitest --coverage
          mkdir -p coverage-current
          cp coverage/coverage-summary.json coverage-current/coverage-summary.json

      - name: Compare coverage
        run: |
          npx ts-node scripts/compare-all-coverage.ts > coverage-diff-result.txt
          if grep -q "Coverage decreased" coverage-diff-result.txt; then
            echo "Coverage decreased, failing workflow."
            exit 1
          else
            echo "Coverage is stable or improved."
          fi

      - name: Comment coverage result to PR
        if: always()  
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const resultPath = 'coverage-diff-result.txt';
            const result = fs.existsSync(resultPath) ? fs.readFileSync(resultPath, 'utf-8') : 'No coverage comparison result found.';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: result,
            });
