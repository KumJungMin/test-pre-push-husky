name: Coverage Checker on Develop

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  issues: write
  pull-requests: write
  
jobs:
  test-and-compare:
    if: github.event.pull_request.base.ref == 'develop' && github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      # --- Helper function: Run tests and save coverage ---
      # 해당 쉘 스크립트 블록은 지정한 브랜치에서 테스트 실행 및 커버리지 파일 저장을 담당합니다.
      # 인자로 브랜치 이름, 체크아웃 명령어, 저장할 디렉터리명을 받습니다.
      - name: Run tests and save coverage on develop branch
        id: develop_coverage
        run: |
          # checkout develop 브랜치
          git fetch origin develop
          git checkout origin/develop -b develop
          # 테스트 실행 및 커버리지 생성
          npx vitest --coverage
          # 커버리지 파일 저장 (디렉터리 생성 및 복사)
          mkdir -p coverage-develop
          cp coverage/coverage-summary.json coverage-develop/coverage-summary.json

      - name: Checkout current branch again
        run: |
          git checkout -f ${{ github.event.pull_request.head.ref }}
          echo "Checked out branch ${{ github.event.pull_request.head.ref }}"

      - name: Run tests and save coverage on current branch
        run: |
          npx vitest --coverage
          mkdir -p coverage-current
          cp coverage/coverage-summary.json coverage-current/coverage-summary.json

      - name: Install ts-node and TypeScript
        run: npm install -D ts-node typescript

      - name: Compare coverage
        run: npx ts-node scripts/compare-all-coverage.ts
                  
      - name: Comment coverage result to PR
        if: always()  
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const result = fs.readFileSync('coverage-diff-result.txt', 'utf-8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: result,
            });
